name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Prepare APK artifact
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FF-Tournament.apk
          ls -lh artifacts/FF-Tournament.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-tournament-debug-apk
          path: artifacts/FF-Tournament.apk
          if-no-files-found: error
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "## Android APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for the exact error." >> "$GITHUB_STEP_SUMMARY"
