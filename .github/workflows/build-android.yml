name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - public/downloads/FF-Tournament.apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Allow APK installation from FF Tournament
        run: |
          set -euxo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' "$MANIFEST"
          grep -n "REQUEST_INSTALL_PACKAGES" "$MANIFEST"

      - name: Add native FF Tournament updater
        run: |
          set -euxo pipefail
          MAIN="android/app/src/main/java/com/fftournament/app/MainActivity.java"
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'EOF'
          package com.fftournament.app;
          
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler();
              private long downloadId = -1L;
              private Uri pendingInstallUri;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  if (bridge == null) return;
          
                  WebView webView = bridge.getWebView();
                  webView.addJavascriptInterface(new FFUpdaterBridge(), "FFUpdater");
              }
          
              private class FFUpdaterBridge {
                  @JavascriptInterface
                  public void startUpdate(String downloadUrl) {
                      if (downloadUrl == null || downloadUrl.trim().isEmpty()) {
                          notifyJsError("Update URL is missing");
                          return;
                      }
          
                      Uri uri = Uri.parse(downloadUrl);
                      if (!"https".equalsIgnoreCase(uri.getScheme())
                          || !"ff-tournament-livid.vercel.app".equalsIgnoreCase(uri.getHost())) {
                          notifyJsError("Invalid FF Tournament update URL");
                          return;
                      }
          
                      startNativeUpdate(downloadUrl);
                  }
              }
          
              private void startNativeUpdate(String downloadUrl) {
                  try {
                      DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
          
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(downloadUrl));
                      request.setTitle("FF Tournament update");
                      request.setDescription("Downloading the latest FF Tournament version");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );
                      request.setDestinationInExternalFilesDir(
                          this,
                          Environment.DIRECTORY_DOWNLOADS,
                          "FF-Tournament-update.apk"
                      );
          
                      downloadId = manager.enqueue(request);
                      notifyJsProgress(0);
                      pollDownload(manager);
                  } catch (Exception e) {
                      notifyJsError(e.getMessage() == null ? "Unable to start APK download" : e.getMessage());
                  }
              }
          
              private void pollDownload(DownloadManager manager) {
                  handler.postDelayed(() -> {
                      if (downloadId < 0) return;
          
                      Cursor cursor = null;
                      try {
                          cursor = manager.query(new DownloadManager.Query().setFilterById(downloadId));
                          if (cursor == null || !cursor.moveToFirst()) {
                              notifyJsError("APK download could not be found");
                              return;
                          }
          
                          int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          long downloaded = cursor.getLong(cursor.getColumnIndexOrThrow(
                              DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR
                          ));
                          long total = cursor.getLong(cursor.getColumnIndexOrThrow(
                              DownloadManager.COLUMN_TOTAL_SIZE_BYTES
                          ));
          
                          if (total > 0) {
                              int percent = (int) Math.min(99L, (downloaded * 100L) / total);
                              notifyJsProgress(percent);
                          }
          
                          if (status == DownloadManager.STATUS_SUCCESSFUL) {
                              Uri fileUri = manager.getUriForDownloadedFile(downloadId);
                              if (fileUri == null) {
                                  notifyJsError("Downloaded APK URI is unavailable");
                                  return;
                              }
          
                              notifyJsProgress(100);
                              notifyJsComplete();
                              pendingInstallUri = fileUri;
                              handler.postDelayed(this::openInstaller, 450);
                              return;
                          }
          
                          if (status == DownloadManager.STATUS_FAILED) {
                              int reason = cursor.getInt(cursor.getColumnIndexOrThrow(
                                  DownloadManager.COLUMN_REASON
                              ));
                              notifyJsError("Android download failed (" + reason + ")");
                              return;
                          }
          
                          pollDownload(manager);
                      } catch (Exception e) {
                          notifyJsError(e.getMessage() == null ? "Unable to check APK download" : e.getMessage());
                      } finally {
                          if (cursor != null) cursor.close();
                      }
                  }, 250);
              }
          
              private void openInstaller() {
                  if (pendingInstallUri == null) {
                      notifyJsError("APK installer URI is unavailable");
                      return;
                  }
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      && !getPackageManager().canRequestPackageInstalls()) {
                      Intent settings = new Intent(
                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                          Uri.parse("package:" + getPackageName())
                      );
                      startActivity(settings);
                      return;
                  }
          
                  try {
                      Intent install = new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(
                          pendingInstallUri,
                          "application/vnd.android.package-archive"
                      );
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(install);
                  } catch (Exception e) {
                      notifyJsError(e.getMessage() == null ? "Unable to open Android installer" : e.getMessage());
                  }
              }
          
              private void notifyJsProgress(int percent) {
                  if (bridge == null) return;
                  bridge.eval("window.__ffUpdateProgress && window.__ffUpdateProgress(" + percent + ");", null);
              }
          
              private void notifyJsComplete() {
                  if (bridge == null) return;
                  bridge.eval("window.__ffUpdateComplete && window.__ffUpdateComplete();", null);
              }
          
              private void notifyJsError(String message) {
                  if (bridge == null) return;
                  String safe = message == null ? "Unknown update error" : message
                      .replace("\\", "\\\\")
                      .replace("\"", "\\\"");
                  bridge.eval(
                      "window.__ffUpdateError && window.__ffUpdateError(\"" + safe + "\");",
                      null
                  );
              }
          }
          EOF
          grep -n "class MainActivity" "$MAIN"

      - name: Prepare FF Tournament app icon
        run: |
          set -euxo pipefail
          mkdir -p resources
          cp src/logo.png.png resources/icon.png
          file resources/icon.png
          ls -lh resources/icon.png

      - name: Generate Android app icons
        run: |
          npx --yes @capacitor/assets generate --android

      - name: Set Android app version
        run: |
          set -euxo pipefail
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "'$VERSION'"/' android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Limit APK to ARM64
        run: |
          set -euxo pipefail
          sed -i '/    defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a"\n        }' android/app/build.gradle
          grep -n -A8 "defaultConfig" android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt"
            if ./gradlew assembleDebug --stacktrace --info --refresh-dependencies; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution/build failed; retrying in 10 seconds..."
              sleep 10
            fi
          done
          exit 1

      - name: Prepare APK artifact
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FF-Tournament.apk
          ls -lh artifacts/FF-Tournament.apk

      - name: Publish latest APK to Vercel static download
        run: |
          set -euxo pipefail
          mkdir -p public/downloads
          cp artifacts/FF-Tournament.apk public/downloads/FF-Tournament.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/FF-Tournament.apk
          git diff --cached --quiet && exit 0
          git commit -m "Update latest Android APK"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-tournament-debug-apk
          path: artifacts/FF-Tournament.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: FF Tournament Android v0.0.${{ github.run_number }}
          files: artifacts/FF-Tournament.apk
          generate_release_notes: true

      - name: Failure summary
        if: failure()
        run: |
          echo "## Android APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for the exact error."