name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Prepare FF Tournament app icon
        run: |
          set -euxo pipefail
          mkdir -p resources
          cp src/logo.png.png resources/icon.png
          file resources/icon.png
          ls -lh resources/icon.png

      - name: Generate Android app icons
        run: |
          npx --yes @capacitor/assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Prepare APK artifact
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FF-Tournament.apk
          ls -lh artifacts/FF-Tournament.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-tournament-debug-apk
          path: artifacts/FF-Tournament.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: FF Tournament Android v0.0.${{ github.run_number }}
          files: artifacts/FF-Tournament.apk
          generate_release_notes: true

      - name: Failure summary
        if: failure()
        run: |
          echo "## Android APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for the exact error."